services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labqueue
      POSTGRES_DB: labqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labqueue -d labqueue"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://labqueue:${POSTGRES_PASSWORD}@db:5432/labqueue?sslmode=disable
      BOT_TOKEN: ${BOT_TOKEN:-}
      ROOT_TELEGRAM_IDS: ${ROOT_TELEGRAM_IDS:?Set ROOT_TELEGRAM_IDS in .env}
      DEV_AUTH: ${DEV_AUTH:-false}
      APP_URL: ${APP_URL:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on: [app]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
